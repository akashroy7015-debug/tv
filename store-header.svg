<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0d14"/>
      <stop offset="1" stop-color="#11121c"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.55" stop-color="#ff5ca8"/>
      <stop offset="1" stop-color="#ffb23e"/>
    </linearGradient>
    <linearGradient id="gradV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.55" stop-color="#ff5ca8"/>
      <stop offset="1" stop-color="#ffb23e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb23e" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffb23e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="300" fill="url(#bg)"/>
  <circle cx="1380" cy="60" r="340" fill="url(#glow)"/>
  <circle cx="220" cy="300" r="300" fill="url(#glow2)"/>

  <!-- Logo mark: two file chips with a morph arrow -->
  <g transform="translate(90,96)">
    <rect x="0" y="0" width="80" height="104" rx="14" fill="none" stroke="url(#gradV)" stroke-width="5"/>
    <rect x="14" y="22" width="40" height="7" rx="3.5" fill="#ff5ca8" opacity="0.85"/>
    <rect x="14" y="40" width="52" height="7" rx="3.5" fill="#7c5cff" opacity="0.7"/>
    <rect x="14" y="58" width="34" height="7" rx="3.5" fill="#7c5cff" opacity="0.5"/>
    <path d="M104 52 h54 M150 40 l16 12 -16 12" fill="none" stroke="url(#grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="180" y="0" width="80" height="104" rx="14" fill="url(#gradV)"/>
    <path d="M206 52 l14 16 26 -34" fill="none" stroke="#0c0d14" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="420" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="86" font-weight="800" fill="#ffffff" letter-spacing="-1">File<tspan fill="url(#grad)">Morph</tspan></text>
  <text x="424" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="500" fill="#aab" letter-spacing="0.5">Fast, private file conversion — images, PDFs, audio &amp; more</text>

  <!-- Pills -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600">
    <rect x="424" y="222" width="232" height="46" rx="23" fill="none" stroke="#2a2c3c" stroke-width="2"/>
    <text x="540" y="252" fill="#cfd2e6" text-anchor="middle">5 free every month</text>
    <rect x="672" y="222" width="210" height="46" rx="23" fill="none" stroke="#2a2c3c" stroke-width="2"/>
    <text x="777" y="252" fill="#cfd2e6" text-anchor="middle">100% in-browser</text>
    <rect x="898" y="222" width="170" height="46" rx="23" fill="none" stroke="#2a2c3c" stroke-width="2"/>
    <text x="983" y="252" fill="#cfd2e6" text-anchor="middle">No uploads</text>
  </g>
</svg>
